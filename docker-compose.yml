services:
  db:
    image: postgres:14
    container_name: trebol_db
    environment:
      POSTGRES_DB: Trebol4Devop
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/trebol4devop.dump:/dump/trebol4devop.dump:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U odoo -d Trebol4Devop && psql -h 127.0.0.1 -U odoo -d Trebol4Devop -tAc \"select count(*) from ir_module_module\" | grep -qE '^[1-9]'",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    container_name: trebol_odoo
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./db/filestore:/var/lib/odoo/.local/share/Odoo/filestore/Trebol4Devop
      - ./odoo/addons:/mnt/extra-addons
      - ./assets:/mnt/assets:ro
      - ./scripts:/mnt/scripts:ro
    ports:
      - "8069:8069"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8069/web/database/selector', timeout=5)\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: trebol_bridge
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      ODOO_URL: http://odoo:8069
      ODOO_DB: Trebol4Devop
      ODOO_API_LOGIN: ${ODOO_API_LOGIN:-ecommerce_api}
      ODOO_API_PASSWORD: ${ODOO_API_PASSWORD:-TrebolApi2026!}
      BRIDGE_API_KEY: ${BRIDGE_API_KEY:-trebol-bridge-dev-key}
      PORTAL_TOKEN_SECRET: ${PORTAL_TOKEN_SECRET:-trebol-portal-dev-secret}
      PORTAL_ACCESS_CODE: ${PORTAL_ACCESS_CODE:-trebol2026}
      BRIDGE_PUBLIC_URL: ${BRIDGE_PUBLIC_URL:-http://localhost:4000}
      DEMO_MODE: ${DEMO_MODE:-true}
      TZ: America/Guatemala
    volumes:
      - ./bridge:/app
      - bridge_node_modules:/app/node_modules
      - ./assets:/assets:ro
    ports:
      - "4000:4000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: trebol_tunnel
    profiles: ["tunnel"]
    depends_on:
      - bridge
    command: tunnel --no-autoupdate --url http://bridge:4000

  metabase:
    image: metabase/metabase:latest
    container_name: trebol_metabase
    profiles: ["bi"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: odoo
      MB_DB_PASS: odoo
      MB_DB_HOST: db
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "3001:3000"

volumes:
  pgdata:
  odoo_data:
  metabase_data:
  bridge_node_modules:
